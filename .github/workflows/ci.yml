name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 3

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: clippy
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: test
      - run: cargo test --all --verbose

  check-native:
    name: Check ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          key: native-${{ matrix.target }}
      - name: Clear ORT download cache (Windows x86_64)
        if: runner.os == 'Windows' && matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "$env:LOCALAPPDATA\ort.pyke.io"
      - name: Check
        shell: bash
        run: |
          TARGET="${{ matrix.target }}"
          if [ "${{ runner.os }}" = "Windows" ] && [ "$TARGET" = "x86_64-pc-windows-msvc" ]; then
            for attempt in 1 2 3; do
              if cargo check --target "$TARGET" --all; then
                exit 0
              fi
              echo "ORT build attempt $attempt failed; clearing ort cache and retrying..."
              rm -rf "$HOME/AppData/Local/ort.pyke.io" || true
              sleep 45
            done
            exit 1
          fi
          cargo check --target "$TARGET" --all

  check-cross-linux:
    name: Check ${{ matrix.target }} (cross)
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
          - target: x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          key: cross-${{ matrix.target }}
      - name: Cache cross binary
        id: cross-cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cross
          key: cross-bin-v1-${{ runner.os }}
      - name: Install cross
        if: steps.cross-cache.outputs.cache-hit != 'true'
        run: cargo install cross --git https://github.com/cross-rs/cross
      - run: cross check --target ${{ matrix.target }} --all
